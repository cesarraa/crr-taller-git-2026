spring.application.name=cs2

# ========================================================
# Configuración de Base de Datos H2 en Memoria
# ========================================================
spring.datasource.url=jdbc:h2:mem:cs2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========================================================
# Configuración de Spring Data JPA / Hibernate
# ========================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================================
# Consola Web H2 (accesible en http://localhost:8080/h2-console)
# ========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================================
# APIs cruzadas POO-09 (valores pendientes de confirmar con el grupo)
# ========================================================
apis.a2.base-url=${A2_BASE_URL:http://localhost:8081}
apis.a2.open-api-url=${A2_OPENAPI_URL:http://localhost:8081/v3/api-docs}
apis.a2.validacion-path=${A2_VALIDACION_PATH:/api/simulacion/combate}
apis.a3.base-url=${A3_BASE_URL:http://localhost:8082}
apis.a3.open-api-url=${A3_OPENAPI_URL:http://localhost:8082/v3/api-docs}
apis.a3.validacion-path=${A3_VALIDACION_PATH:/api/armas}


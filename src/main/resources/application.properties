spring.application.name=cs2
server.port=8082

# ========================================================
# Configuración de Base de Datos H2 en Memoria
# ========================================================
spring.datasource.url=jdbc:h2:mem:cs2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========================================================
# Configuración de Spring Data JPA / Hibernate
# ========================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================================
# Consola Web H2 (accesible en http://localhost:8080/h2-console)
# ========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================================
# APIs cruzadas POO-09 (A2 = Giovanni/8081, A3 = Luis/8080)
# Endpoints stateless /api/reglas: no dependen de IDs sembrados en H2.
# Giovanni: POST /api/reglas/disparo {municionActual,danoBase,precision,distancia}
# Luis:     POST /api/reglas/combate {tieneBalas,granadaLanzada}
# ========================================================
apis.a2.base-url=${A2_BASE_URL:http://localhost:8081}
apis.a2.open-api-url=${A2_OPENAPI_URL:http://localhost:8081/v3/api-docs}
apis.a2.validacion-path=${A2_VALIDACION_PATH:/api/reglas/disparo}
apis.a2.municion-actual=${A2_MUNICION_ACTUAL:29}
apis.a2.dano-base=${A2_DANO_BASE:36}
apis.a2.precision=${A2_PRECISION:0.85}
apis.a2.distancia=${A2_DISTANCIA:35}
apis.a2.connect-timeout-ms=${A2_CONNECT_TIMEOUT_MS:2000}
apis.a2.read-timeout-ms=${A2_READ_TIMEOUT_MS:3000}
apis.a3.base-url=${A3_BASE_URL:http://localhost:8080}
apis.a3.open-api-url=${A3_OPENAPI_URL:http://localhost:8080/v3/api-docs}
apis.a3.validacion-path=${A3_VALIDACION_PATH:/api/reglas/combate}
apis.a3.tiene-balas=${A3_TIENE_BALAS:true}
apis.a3.granada-lanzada=${A3_GRANADA_LANZADA:false}
apis.a3.connect-timeout-ms=${A3_CONNECT_TIMEOUT_MS:2000}
apis.a3.read-timeout-ms=${A3_READ_TIMEOUT_MS:3000}


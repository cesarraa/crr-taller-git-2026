spring.application.name=cs2

# ========================================================
# Configuración de Base de Datos H2 en Memoria
# ========================================================
spring.datasource.url=jdbc:h2:mem:cs2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========================================================
# Configuración de Spring Data JPA / Hibernate
# ========================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================================
# Consola Web H2 (accesible en http://localhost:8080/h2-console)
# ========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

